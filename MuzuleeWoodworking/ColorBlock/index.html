<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
        <title>色塊編織圖案預覽</title>
        <link rel="icon" href="../assets/logo.jpg">
        <link href="../assets/site.css" rel="stylesheet" />
        <script src="../assets/lineColor.js"></script>
    </head>
    <body>
    <div class="mybox">
        <div class="row lineSel">            
            <div class="col-10 text-left" style="position: relative;">
                <div id="showLineNo">
                    <span >圈數</span><span id="tx_LineNow"></span><span>/</span><span id="tx_LineTot"></span>
                    <span class="description"> 說明：點按各色按鈕，圈數即會自動+1，必要時再透過上一條或下一條調整 </span>
                </div>
            </div>
            <div class="col-2 text-left" style="position: relative; margin-bottom:3px;">
                <div >
                    <a href="https://www.facebook.com/profile.php?id=100075865565729" target="_blank">
                    <img src="../assets/logo.jpg" style="width:60px;height:60px; float:right;"></img></a>           	
                </div>
            </div>
        </div>

        <!-- 按鈕列 -->
        <!-- <div class="row" style="position: relative;"> -->
        <!-- 控制參數 -->
        <div class="col-12 text-left"  style="position: relative;display: inline;">
            <!-- <select id="lineType" class="mybtn" style="visibility: hidden;"> -->
            <select id="lineType" class="mybtn" style="width:5.5rem;">
                <option value="1">橫列</option>
                <option value="2">直行(鑽線)</option>
            </select> 
            <!-- <select id="lineNum" class="mybtn1" style="visibility: hidden;"></select>           -->
            <select id="lineNum" class="mybtn1"></select>
            <input type="button" class="mybtn1 btn-outline-success" id="btnPrev" value="上一條" >
            <input type="button" class="mybtn1 btn-outline-success" id="btnNext" value="下一條" >
            <input type="button" class="mybtn2 btn-outline-success" id="btnReset" value="清除" >
            <input type="button" class="mybtn2 btn-outline-success" id="btnSample" value="樣版" >
            <input type="button" class="mybtn2 btn-outline-success" id="btnOutput" value="輸出" data-bs-toggle="modal" data-bs-target="#myModal">
        </div>
        <!-- 線條顏色 -->
        <div class="row">
            <div id='selBox' class="col-12 selbox"></div>
        </div>
        <!-- 垂直鑽線操作 -->
        <div class="row" id="verticlaOperateZone" style="display:none; border: 1px dotted fuchsia;">
            <div class="col-12 selbox">
                <span style="font-size: 1rem; text-decoration: dotted; vertical-align:bottom; line-height: 1.75rem;">【直行(鑽線)】第<span id="vLineNo" style="margin:0 5px"></span>條</span>
                <!-- 垂直鑽線 -->
                <select id="vlineNum" class="mybtn1"></select>
                <input type="button" class="mybtn1 btn-outline-success" id="btnDown" value="鑽" >
                <input type="button" class="mybtn1 btn-outline-success" id="btnUp" value="浮" >
            </div>
        </div>
        <!-- 椅子呈現 -->
        <div class="row"  style="height:70%;">
             <div id="aboveCanvas" class="col-lg-8 col-md-8 col-xs-12 text-center">
                <div class="row">
                    <div id="myBoxZone" class="myZone"></div>
                </div>
            </div>
        </div>
        <!-- The Modal -->
        <div class="modal fade" id="myModal">
            <div class="modal-dialog modal-fullscreen">
                <div class="modal-content">

                    <!-- Modal Header -->
                    <div class="modal-header">
                        <h5 class="modal-title">紙繩配色紀錄</h5>

                    </div>

                    <!-- Modal body -->
                    <div class="modal-body">
                        <h6>※建議使用螢幕截圖將配色紀錄保留※</h6>

                    </div>

                    <!-- Modal footer -->
                    <div class="modal-footer">
                        <!--   <button type="button" class="btn btn-danger" data-bs-dismiss="modal" onclick="screenshot()">關閉</button>  -->

                    </div>
                </div>
            </div>
        </div>
    </div>

    

    <script type="text/javascript" charset="utf-8">
    var box = document.getElementById("myBoxZone");
    var hLineCnt =30;//30;//60
    var vLineCnt =44;//44;//88
    var selColor_H={};  //水平
    var selColor_V={};  //垂直
    var selBlock_S={};  //垂直線條區塊設定
    var cntColor = boxColor.length;
    var sampleNo = 1;

    function ini(){
        //彩色線條
        var selBox="";
        for (let i = 0; i < boxColor.length; i++) {
            let lightColor = boxlightColors.includes(boxColor[i].color)?"color:black;":"";
            selBox += '<div id="divCLR'+ i +'" style="background-color:'+boxColor[i].color+';' + lightColor + '">'+boxColor[i].name+'</div>';
        }
        $('#tx_LineTot').html(hLineCnt+vLineCnt);
        $('#selBox').html(selBox);
        renderTable();
    }
    function renderTable(){
        //動態調整每一列的線條數量
        document.documentElement.style.setProperty('--col-count', vLineCnt);
        document.documentElement.style.setProperty('--cornerWidth', "50px");
        document.documentElement.style.setProperty('--lineWidth', "10px");
        var strBox="";
        var x,y;
        //<!--Top Memo-->
        strBox += '<div class="myEpt"></div>' + '<div class="myEpt"></div>';
        for (let i = 1; i <= vLineCnt; i++) {    	  
            strBox += '<div class="myEpt" id="myLine_v_'+i.toString()+'">'+i.toString()+'</div>';
        }
        strBox += '<div class="myEpt"></div>';
        //<!--Top-->
        strBox += '<div class="myEpt"></div>' + '<div class="cornerTL"></div>';
        //線條 myLine
        x=0;
        for (let i = 1; i <= vLineCnt; i++) {
            y=i; 
            strBox += '<div class="myLine myTBT" id="myLine_'+ x.toString() + '_' + y.toString() + '"></div>';
        }
        strBox += '<div class="cornerTR"></div>'; 

        //<!--Mid-->
        x=0;
        y=0;
        for (let j=1; j <= hLineCnt; j++){
            strBox += '<div class="myEpt" id="myLine_h_'+j.toString()+'">'+j.toString()+'</div>';
            //線條 myLine
            x=j;
            y=0;
            strBox += '<div class="myLine myLRL" id="myLine_'+ x.toString() + '_' + y.toString() + '"></div>';
            for (let i = 1; i <= vLineCnt; i++) {
                y=i;
                strBox += '<div class="myLine myMM" id="myLine_'+ x.toString() + '_' + y.toString() + '"></div>';
            }
            y+=1;
            strBox += '<div class="myLine myLRR" id="myLine_'+ x.toString() + '_' + y.toString() + '"></div>';
        }
        //<!--Bot-->
        strBox += '<div class="myEpt"></div>' + '<div class="cornerBL"></div>';
        //線條 myLine
        x=hLineCnt+1;
        for (let i = 1; i <= vLineCnt; i++) {  
            y=i;
            strBox += '<div class="myLine myTBB" id="myLine_'+ x.toString() + '_' + y.toString() + '"></div>';
        }
        strBox += '<div class="cornerBR"></div>';        
        //render
        $('#myBoxZone').html(strBox);
        ressetLine();
    }

    function ressetLine(){    
        var lType = 1;    
        var lNum = 1;    
        for (let i = 1; i <= hLineCnt; i++) {    	  
            selColor_H[i]=0;
        }
        for (let i = 1; i <= vLineCnt; i++) {    	  
            //selColor_V[i]=i>15?1:i;
            selColor_V[i]=1;
        }  
        //垂直線條區塊設定
        for (let i = 1; i <= vLineCnt; i++) {
            selBlock_S[i] = []; //垂直鑽線數量
            for (let j = 1; j <= hLineCnt; j++) {
                selBlock_S[i][j] = 0;  //每條線鑽入位置初始    0:不鑽、1:鑽線
            }
        }

        // 測試區塊
        selBlock_S[2][2] = 1;
        selBlock_S[2][3] = 1;
        selBlock_S[2][4] = 1;
        // selBlock_S[3][2] = 1;
        selBlock_S[3][3] = 1;
        // selBlock_S[3][1] = 1;
        
        $('#lineType').val(lType);    
        iniLineNum(lType);
        showChoice(lType,lNum);
        preview();
    }
    function iniLineNum(lType){
        var iCnt=(lType=='1')?hLineCnt:vLineCnt;
        $("#lineNum").empty();
        for (i=1;i<=iCnt;i++){ 
            let op = document.createElement('option');
            op.value = i;
            op.innerHTML = i;
            document.getElementById("lineNum").appendChild(op);
        }
        $("#vlineNum").empty();
        for (i=1;i<=hLineCnt;i++){ 
            let op = document.createElement('option');
            op.value = i;
            op.innerHTML = i;
            document.getElementById("vlineNum").appendChild(op);
        }
    }
    function showChoice(lType,lNum){
        $("#selBox div").removeClass("active");
        iSel=(lType=='2'?selColor_V[lNum]:selColor_H[lNum]);
        $("#divCLR"+iSel).addClass( "active");      
        $('#tx_LineNow').html(lNum*1.0 + (lType=='2'? hLineCnt :0));
        //顯示選取的線條位置
        showSelLine();
    }
    function preview(){ 
        //console.log("preview");
        //console.log(document.getElementsByClassName("myLine"));
        for (i=1;i<=hLineCnt;i++){ 
            for (j=0;j<=vLineCnt+1;j++){
                let _cell_id  ="#myLine_"+i.toString()+"_"+j.toString();
                //console.log($("#myLine_"+i.toString()+"_"+j.toString()));
                $(_cell_id).css("background-color", boxColor[selColor_H[i]].color);
                // console.log(selColor_H[i]);
                // console.log( boxColor[selColor_H[i]].color);
                // $("#myLine_"+i.toString()+"_"+j.toString()).css("background-color", boxColor[selColor_H[i]].color);
                //$("#myLine_"+i.toString()+"_"+j.toString()).html("*");
            }
        }
        //垂直線條區塊設定上下
        for (j=1;j<=vLineCnt;j++){
            let x_b=0; x_e=hLineCnt+1;
            $("#myLine_"+x_b.toString()+"_"+j.toString()).css("background-color", boxColor[selColor_V[j]].color); 
            $("#myLine_"+x_e.toString()+"_"+j.toString()).css("background-color", boxColor[selColor_V[j]].color); 
        }
        //垂直線條區塊設定 //顏色、x=Horizontal、y=Vertical
        //console.log(selBlock_S);
        for (let y=1;y<=vLineCnt;y++){
            for (let x=1;x<=hLineCnt;x++){
                let _color = (selBlock_S[y][x]==0)?boxColor[selColor_H[x]].color:boxColor[selColor_V[y]].color;
                $("#myLine_"+x.toString()+"_"+y.toString()).css("background-color", _color);
            }
        }
        //顯示選取線條位置
        showSelLine();

        //顯示清單
        var showname='';
        for (let j = 1; j <=hLineCnt ; j++){    
            showname += "<div class='col-2 text-left'>【" + j + "】<br/>" + boxColor[selColor_H[j]].name + "</div>";
        }
        showname+="<br>";
        for (let k = 1; k <= vLineCnt; k++) {
            showname += "<div class='col-2 text-left'>【" + (hLineCnt*1.0+k) + "】<br/>" + boxColor[selColor_V[k]].name + "</div>";
        }
        $('#lineNames').html(showname);
    }
    function choiceColor(lType,lNum,iSel){
        $("#selBox div").removeClass("active");
        $("#divCLR"+iSel).addClass( "active");
        if (lType=='2')
            selColor_V[lNum]=iSel;
        else
            selColor_H[lNum]=iSel;    
        preview();  
    }
    function showSelLine(){
        //顯示選取線條位置
        let lType= $('#lineType').val();
        let lNum= $('#lineNum').val();
        for (let j = 1; j <= hLineCnt; j++){  
            $("#myLine_h_" + j.toString()).removeClass("selBold");
        }
        for (let k = 1; k <= vLineCnt; k++) {
            $("#myLine_v_" + k.toString()).removeClass("selBold");
        }
        var selLine = (lType=="1")? $("#myLine_h_" + lNum.toString()): $("#myLine_v_" + lNum.toString());
        selLine.addClass("selBold");

        //顯示垂直鑽線區塊(lType=="2")
        if (lType=="2"){
            $("#verticlaOperateZone").show();
            $("#vLineNo").html(lNum);
            //初始鑽線位置
            $("#vlineNum").val(1);
            showSelLine_v();
        }
        else
            $("#verticlaOperateZone").hide();
    }
    //ShowSelLine垂直
    function showSelLine_v(){
        //console.log(selBlock_S);
        //初始化showVLine
        for (let y=1;y<=vLineCnt;y++){
            for (let x=1;x<=hLineCnt;x++){

                $("#myLine_"+x.toString()+"_"+y.toString()).removeClass("showVLine");
            }
        }
        let _x= $('#vlineNum').val();
        let _y= $("#lineNum").val();
        let _color = (selBlock_S[_y][_x]==0)?boxColor[selColor_H[_x]].color:boxColor[selColor_V[_y]].color;
        $("#myLine_"+ _x.toString() + "_" + _y.toString()).addClass("showVLine").css("background-color", _color);
    }

    $(function(){     
        ini();
        $("#selBox div").click(function() {
            var lType= $('#lineType').val();
            var lNum= $('#lineNum').val();
            var iSel=this.id.replace('divCLR','');
            choiceColor(lType,lNum,iSel); 
            $("#btnNext").click();
        });
        $("#lineType,#lineNum").change(function() {
            var lType= $('#lineType').val();
            if(this.id=="lineType"){
                $('#lineNum').val(1);
                iniLineNum(lType);
            }
            showChoice(lType,$('#lineNum').val());    
        });
        $("#btnPrev,#btnNext").click(function() {
            var lNum= $('#lineNum');
            var iNum=lNum.val()*1.0+((this.id=='btnPrev')?-1:1);
            var lType= $('#lineType').val();
            
            if(this.id=='btnPrev'){
                if (iNum==0){
                    console.log('btnPrev');
                    $('#lineType').val((lType==1)?2:1);
                    iniLineNum($('#lineType').val());
                    lNum.val((lType=='1')?vLineCnt:hLineCnt);
                }else{
                    var iTot=(lType=='1'?hLineCnt:vLineCnt);
                    lNum.val((iNum%iTot==0)?iTot:(iNum%iTot));
                }
            }else{
                var iTot=(lType=='1'?hLineCnt:vLineCnt);
                lNum.val((iNum%iTot==0)?iTot:(iNum%iTot));
                if (iNum>iTot){
                    lNum.val(1);
                    $('#lineType').val((lType==1)?2:1);        
                    iniLineNum($('#lineType').val());
                }else{
                    lNum.val((iNum%iTot==0)?iTot:(iNum%iTot));
                }
            }
            lNum.change();
        });
        $("#btnReset").click(function() {
            ressetLine();
        });
        $("#btnSample").click(function() {
            getSample(sampleNo);
        });
        $("#vlineNum").change(function() { 
            showSelLine_v();
        });
        $("#btnUp,#btnDown").click(function() {
            let _x= $('#vlineNum').val();
            let _y= $("#lineNum").val();
            selBlock_S[_y][_x]=((this.id=="btnDown")?0:1);
            showSelLine_v();
            if (_x*1<hLineCnt*1){
                $('#vlineNum').val((_x*1+1).toString());
                showSelLine_v();
            }
        });
    });
    </script>
